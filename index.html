<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>監票計數</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
    background: #f4f5f7; color: #1c1c1e;
  }
  .screen { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .hide { display: none !important; }
  button { font-family: inherit; touch-action: manipulation; user-select: none; }

  /* 選縣市 */
  .pick { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .pick h1 { font-size: 20px; margin: 4px 4px 0; }
  .pick .hint { color: #666; font-size: 13px; margin: 2px 4px 0; }
  .pick .regions { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; }
  .pick h2 { font-size: 13px; color: #888; margin: 6px 4px 4px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid button {
    height: min(48px, 6vh); min-height: 38px; border: 0; border-radius: 10px; background: #fff;
    font-size: 16px; font-weight: 600; color: #1c1c1e; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .grid button:active { background: #e8eefc; }

  /* 計票 */
  header {
    background: #fff; padding: 6px 10px; border-bottom: 1px solid #e2e4e8;
    display: flex; justify-content: space-between; align-items: center; flex: none;
  }
  .back { border: 0; background: transparent; color: #3478f6; font-size: 15px; padding: 6px 4px; }
  #cityTitle { font-size: 17px; margin: 0; }
  .total { font-size: 13px; color: #666; text-align: right; line-height: 1.2; }
  .total b { color: #1c1c1e; font-size: 18px; }
  .total .sub { font-size: 11px; }

  .sortbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; flex: none; }
  .sortbar span { font-size: 13px; color: #666; }
  .seg { display: flex; background: #e4e6ea; border-radius: 9px; padding: 2px; }
  .seg button {
    border: 0; background: transparent; font-size: 13px; padding: 5px 12px; border-radius: 7px; color: #444;
  }
  .seg button.on { background: #fff; color: #1c1c1e; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .sortbar .refresh {
    border: 0; background: #3478f6; color: #fff; font-size: 13px; font-weight: 700;
    padding: 6px 11px; border-radius: 9px;
  }
  .sortbar .refresh:active { filter: brightness(.9); }
  .sortbar .spacer { flex: 1; }
  .sortbar .reset { border: 0; background: transparent; color: #999; font-size: 13px; padding: 6px 4px; }

  .list { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 2px 10px calc(8px + env(safe-area-inset-bottom)); }
  .row {
    flex: 1 1 0; min-height: 0; max-height: 92px;
    background: #fff; border-radius: 12px; padding: 5px 6px 5px 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); display: flex; align-items: center; gap: 8px;
  }
  .row { border: 2px solid transparent; }
  .row.kmt { border-color: #2f6fd6; background: #eef4ff; }
  .row.dpp { border-color: #2e9d4f; background: #eefaf1; }
  .row.tpp { border-color: #14b8b0; background: #ecfbfa; }
  .row.kmt .no { background: #2f6fd6; }
  .row.dpp .no { background: #2e9d4f; }
  .row.tpp .no { background: #14b8b0; }
  .who { flex: 0 0 36%; min-width: 0; display: flex; align-items: center; gap: 7px; }
  /* 減號靠左：[−] [號碼 名字] [數字] [+] */
  .lefty .row { padding: 5px 6px; }
  .lefty .ctrl { display: contents; }
  .lefty .row { gap: 6px; }
  .lefty .row .minus { order: 0; flex: 0 0 48px; align-self: stretch; }
  .lefty .row .who { order: 1; flex: 1 1 0; gap: 5px; }
  .lefty .row .who .name { font-size: 16px; }
  .lefty .row .count { order: 2; flex: 0 0 100px; width: 100px; align-self: stretch; font-size: 28px; }
  /* 對調：[名字] [+] [數字] [−] */
  .swapped .ctrl .plus { order: 0; }
  .swapped .ctrl .count { order: 1; }
  .swapped .ctrl .minus { order: 2; }
  .count.len5 { font-size: 17px; }
  .count.len6 { font-size: 14px; }
  .lefty .row .count.len5 { font-size: 24px; }
  .lefty .row .count.len6 { font-size: 19px; }
  .lefty .row .plus { order: 3; flex: 0 0 48px; align-self: stretch; }
  
  .hint-row { display: flex; align-items: center; justify-content: space-between; margin: 2px 4px 0; }
  .hint-row .hint { margin: 0; }
  .hint-row .seg button { padding: 4px 10px; font-size: 12px; }
  .gear { border: 0; background: #e4e6ea; color: #444; font-size: 14px; padding: 5px 10px; border-radius: 8px; margin-left: 6px; }
  .hint-row .gear { margin: 0; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
  .card { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 340px; }
  .card h3 { margin: 0 0 12px; font-size: 18px; }
  .opt { margin-bottom: 14px; }
  .opt .lab { font-size: 13px; color: #666; margin-bottom: 6px; }
  .opt .seg { display: flex; }
  .opt .seg.col { flex-direction: column; gap: 2px; }
  .opt .seg.col button { text-align: left; padding: 10px 12px; }
  .opt .seg button { flex: 1; padding: 9px 4px; font-size: 14px; }
  .done { width: 100%; border: 0; background: #3478f6; color: #fff; font-size: 16px; font-weight: 700; padding: 11px; border-radius: 11px; margin-top: 4px; }
  .no {
    flex: none; background: #1c1c1e; color: #fff; border-radius: 7px; min-width: 26px; text-align: center;
    padding: 2px 0; font-weight: 700; font-size: 15px;
  }
  .no.bad { background: #8e8e93; }
  .txt { min-width: 0; line-height: 1.2; }
  .name { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .party { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctrl { flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: stretch; gap: 6px; }
  .ctrl button { flex: 0 0 52px; border: 0; border-radius: 10px; font-size: 28px; font-weight: 700; line-height: 1; padding: 0; }
  .minus { background: #ffe3e0; color: #c62828; }
  .plus  { background: #dcf3df; color: #1b7a2b; }
  .ctrl button:active { transform: scale(.94); filter: brightness(.95); }
  .count {
    flex: 1; min-width: 0; width: 100%; text-align: center; font-size: 22px; font-weight: 700;
    border: 2px solid #e2e4e8; border-radius: 10px; background: #fafafa; color: inherit; padding: 0;
    font-variant-numeric: tabular-nums;
  }
  .count:focus { outline: none; border-color: #3478f6; background: #fff; }
</style>
</head>
<body>
<div id="pick" class="screen pick">
  <h1>監票計數</h1>
  <div class="hint-row">
    <div class="hint">請選擇縣市長選舉</div>
    <button class="gear" id="gearPick" aria-label="設定">⚙ 設定</button>
  </div>
  <div class="regions" id="regions"></div>
</div>

<div id="counter" class="screen hide">
  <header>
    <div><button class="back" id="back">‹ 換縣市</button><h1 id="cityTitle" style="display:inline"></h1><button class="gear" id="gearCounter" aria-label="設定">⚙</button></div>
    <div class="total">合計 <b id="total">0</b> 票<div class="sub" id="sub"></div></div>
  </header>
  <div class="sortbar">
    <span>排序</span>
    <div class="seg">
      <button id="sortNo" class="on">號次</button>
      <button id="sortVotes">得票數</button>
    </div>
    <button class="refresh hide" id="refresh">↻ 重整</button>
    <div class="spacer"></div>
    <button class="reset" id="reset">全部歸零</button>
  </div>
  <div class="list" id="list"></div>
</div>

<div id="modal" class="modal hide">
  <div class="card" role="dialog" aria-label="設定">
    <h3>設定</h3>
    <div class="opt"><div class="lab">廢票位置</div>
      <div class="seg"><button id="badTop">固定最上</button><button id="badBottom">固定最下</button></div></div>
    <div class="opt"><div class="lab">按鈕排法</div>
      <div class="seg col"><button id="posR">一般　[−] 數字 [+]</button><button id="posL">減號靠左　[−] 名字 數字 [+]</button><button id="posS">對調　名字 [+] 數字 [−]</button></div></div>
    <button class="done" id="modalDone">完成</button>
  </div>
</div>

<script src="candidates.js?v=10"></script>
<script>
(function () {
  const LAST = "vote-counter-last-city", SORT = "vote-counter-sort", POS = "vote-counter-pos", BAD = "vote-counter-bad";
  const pickEl = document.getElementById("pick");
  const counterEl = document.getElementById("counter");
  const listEl = document.getElementById("list");
  const totalEl = document.getElementById("total");
  let city = null, counts = {}, inputs = {}, rows = {}, sortMode = "no", badPos = "bottom", timer = null;

  const key = c => "vote-counter-v2-" + c;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // 縣市選擇
  const regionsEl = document.getElementById("regions");
  REGIONS.forEach(r => {
    const box = document.createElement("div");
    const h = document.createElement("h2"); h.textContent = r.title;
    const g = document.createElement("div"); g.className = "grid";
    r.cities.forEach(c => {
      const b = document.createElement("button"); b.textContent = c;
      b.onclick = () => open(c);
      g.appendChild(b);
    });
    box.append(h, g);
    regionsEl.appendChild(box);
  });

  function save() {
    store.set(key(city), JSON.stringify(counts));
    const valid = CANDIDATES[city].reduce((s, _, i) => s + (counts[i + 1] || 0), 0);
    const bad = counts.x || 0;
    totalEl.textContent = valid + bad;
    document.getElementById("sub").textContent = "有效 " + valid + "・廢票 " + bad;
  }

  // 排序：號次 或 得票數（同票看號次）；廢票永遠在最下面
  function order() {
    const nos = CANDIDATES[city].map((_, i) => i + 1);
    if (sortMode === "votes") nos.sort((a, b) => (counts[b] || 0) - (counts[a] || 0) || a - b);
    if (badPos === "top") nos.unshift("x"); else nos.push("x");
    nos.forEach(n => listEl.appendChild(rows[n]));
  }

  // 得票數排序：停手一下才重排，避免連點時列表跳動點錯
  function scheduleOrder() {
    if (sortMode !== "votes") return;
    clearTimeout(timer);
    timer = setTimeout(order, 1200);
  }

  // 位數多時縮小字級（CSS 的 len5 / len6）
  function fit(input) {
    const n = String(input.value).length;
    input.classList.toggle("len5", n === 5);
    input.classList.toggle("len6", n >= 6);
  }

  function set(no, v) {
    v = Math.max(0, Math.floor(Number(v)) || 0);
    counts[no] = v;
    inputs[no].value = v;
    fit(inputs[no]);
    save();
    scheduleOrder();
  }

  function setSort(m) {
    sortMode = m;
    store.set(SORT, m);
    document.getElementById("sortNo").classList.toggle("on", m === "no");
    document.getElementById("sortVotes").classList.toggle("on", m === "votes");
    document.getElementById("refresh").classList.toggle("hide", m !== "votes");
    clearTimeout(timer);
    if (city) order();
  }

  function open(c) {
    city = c; inputs = {}; rows = {}; counts = {};
    try { counts = JSON.parse(store.get(key(c))) || {}; } catch (e) {}
    store.set(LAST, c);
    document.getElementById("cityTitle").textContent = c + "長";
    listEl.innerHTML = "";
    const entries = CANDIDATES[c].map(([name, party], i) => [i + 1, name, party]);
    entries.push(["x", "廢票", ""]);
    entries.forEach(([no, name, party]) => {
      const row = document.createElement("div");
      row.className = "row" + ({ "國民黨": " kmt", "民進黨": " dpp", "民眾黨": " tpp" }[party] || "");
      row.innerHTML =
        '<div class="who"><span class="no' + (no === "x" ? ' bad' : '') + '">' + (no === "x" ? "廢" : no) + '</span>' +
          '<div class="txt"><div class="name"></div><div class="party"></div></div></div>' +
        '<div class="ctrl">' +
          '<button class="minus" aria-label="減一票">−</button>' +
          '<input class="count" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off">' +
          '<button class="plus" aria-label="加一票">+</button>' +
        '</div>';
      row.querySelector(".name").textContent = name;
      row.querySelector(".party").textContent = party;
      const input = row.querySelector(".count");
      inputs[no] = input; rows[no] = row;
      input.value = counts[no] || 0;
      fit(input);
      row.querySelector(".minus").onclick = () => set(no, (counts[no] || 0) - 1);
      row.querySelector(".plus").onclick = () => set(no, (counts[no] || 0) + 1);
      input.addEventListener("focus", () => setTimeout(() => input.select(), 0));
      input.addEventListener("input", () => { input.value = input.value.replace(/\D/g, ""); });
      input.addEventListener("blur", () => set(no, input.value));
      input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
    });
    save();
    order();
    pickEl.classList.add("hide");
    counterEl.classList.remove("hide");
  }

  document.getElementById("refresh").onclick = () => {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // 先確認輸入中的數字
    clearTimeout(timer);
    save();
    order();
  };

  function setPos(m) {
    store.set(POS, m);
    document.body.classList.toggle("lefty", m === "left");
    document.body.classList.toggle("swapped", m === "swap");
    document.getElementById("posR").classList.toggle("on", m !== "left" && m !== "swap");
    document.getElementById("posL").classList.toggle("on", m === "left");
    document.getElementById("posS").classList.toggle("on", m === "swap");
  }
  function setBad(m) {
    badPos = m === "top" ? "top" : "bottom";
    store.set(BAD, badPos);
    document.getElementById("badTop").classList.toggle("on", badPos === "top");
    document.getElementById("badBottom").classList.toggle("on", badPos === "bottom");
    if (city) order();
  }
  document.getElementById("posR").onclick = () => setPos("right");
  document.getElementById("posL").onclick = () => setPos("left");
  document.getElementById("posS").onclick = () => setPos("swap");
  document.getElementById("badTop").onclick = () => setBad("top");
  document.getElementById("badBottom").onclick = () => setBad("bottom");

  const modal = document.getElementById("modal");
  const openModal = () => modal.classList.remove("hide");
  const closeModal = () => modal.classList.add("hide");
  document.getElementById("gearPick").onclick = openModal;
  document.getElementById("gearCounter").onclick = openModal;
  document.getElementById("modalDone").onclick = closeModal;
  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
  setBad(store.get(BAD));
  setPos(["left", "swap"].includes(store.get(POS)) ? store.get(POS) : "right");

  document.getElementById("sortNo").onclick = () => setSort("no");
  document.getElementById("sortVotes").onclick = () => setSort("votes");

  document.getElementById("back").onclick = () => {
    clearTimeout(timer);
    counterEl.classList.add("hide");
    pickEl.classList.remove("hide");
    store.set(LAST, "");
  };

  document.getElementById("reset").onclick = () => {
    if (confirm("確定要把「" + city + "」所有票數歸零嗎？"))
      [...CANDIDATES[city].map((_, i) => i + 1), "x"].forEach(n => set(n, 0));
  };

  const savedSort = store.get(SORT);
  setSort(savedSort === "votes" ? "votes" : "no");
  const last = store.get(LAST);
  if (last && CANDIDATES[last]) open(last);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>監票計數</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
    background: #f4f5f7; color: #1c1c1e; padding-bottom: 40px;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: #fff; padding: 12px 16px;
    border-bottom: 1px solid #e2e4e8; display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .total { font-size: 14px; color: #666; }
  header .total b { color: #1c1c1e; font-size: 18px; }
  .list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .row {
    background: #fff; border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .who .no {
    background: #1c1c1e; color: #fff; border-radius: 8px; padding: 2px 10px;
    font-weight: 700; font-size: 16px;
  }
  .who .name { font-size: 18px; font-weight: 600; }
  .who .party { font-size: 13px; color: #888; }
  .ctrl { display: flex; align-items: center; gap: 10px; }
  .ctrl button {
    width: 72px; height: 64px; border: 0; border-radius: 14px; font-size: 36px; font-weight: 700;
    line-height: 1; touch-action: manipulation; user-select: none;
  }
  .minus { background: #ffe3e0; color: #c62828; }
  .plus  { background: #dcf3df; color: #1b7a2b; }
  .ctrl button:active { transform: scale(.94); filter: brightness(.95); }
  .count {
    flex: 1; height: 64px; min-width: 0; text-align: center; font-size: 40px; font-weight: 700;
    border: 2px solid #e2e4e8; border-radius: 14px; background: #fafafa; color: inherit;
    font-variant-numeric: tabular-nums; width: 100%;
  }
  .count:focus { outline: none; border-color: #3478f6; background: #fff; }
  .tools { padding: 8px 16px; display: flex; justify-content: center; }
  .tools button {
    border: 0; background: transparent; color: #999; font-size: 14px; padding: 10px 16px;
  }
  .pick { padding: 12px; }
  .pick h2 { font-size: 14px; color: #888; margin: 14px 4px 8px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid button {
    height: 56px; border: 0; border-radius: 12px; background: #fff; font-size: 17px; font-weight: 600;
    color: #1c1c1e; box-shadow: 0 1px 3px rgba(0,0,0,.08); touch-action: manipulation;
  }
  .grid button:active { background: #e8eefc; }
  .back { border: 0; background: transparent; color: #3478f6; font-size: 15px; padding: 6px 4px; }
  .who .party { font-size: 13px; color: #888; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="pick" class="pick">
  <h1 style="font-size:20px;margin:6px 4px">監票計數</h1>
  <div style="color:#666;font-size:14px;margin:0 4px">請選擇縣市長選舉</div>
  <div id="regions"></div>
</div>

<div id="counter" class="hide">
  <header>
    <div><button class="back" id="back">‹ 換縣市</button><h1 id="cityTitle" style="display:inline"></h1></div>
    <div class="total">合計 <b id="total">0</b> 票</div>
  </header>
  <div class="list" id="list"></div>
  <div class="tools"><button id="reset">全部歸零</button></div>
</div>

<script src="candidates.js?v=3"></script>
<script>
(function () {
  const LAST = "vote-counter-last-city";
  const pickEl = document.getElementById("pick");
  const counterEl = document.getElementById("counter");
  const listEl = document.getElementById("list");
  const totalEl = document.getElementById("total");
  let city = null, counts = {}, inputs = {};

  const key = c => "vote-counter-v2-" + c;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // 縣市選擇畫面
  const regionsEl = document.getElementById("regions");
  REGIONS.forEach(r => {
    const h = document.createElement("h2"); h.textContent = r.title;
    const g = document.createElement("div"); g.className = "grid";
    r.cities.forEach(c => {
      const b = document.createElement("button"); b.textContent = c;
      b.onclick = () => open(c);
      g.appendChild(b);
    });
    regionsEl.append(h, g);
  });

  function save() {
    store.set(key(city), JSON.stringify(counts));
    totalEl.textContent = CANDIDATES[city].reduce((s, _, i) => s + (counts[i + 1] || 0), 0);
  }

  function set(no, v) {
    v = Math.max(0, Math.floor(Number(v)) || 0);
    counts[no] = v;
    inputs[no].value = v;
    save();
  }

  function open(c) {
    city = c; inputs = {}; counts = {};
    try { counts = JSON.parse(store.get(key(c))) || {}; } catch (e) {}
    store.set(LAST, c);
    document.getElementById("cityTitle").textContent = c + "長";
    listEl.innerHTML = "";
    CANDIDATES[c].forEach(([name, party], i) => {
      const no = i + 1;
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        '<div class="who"><span class="no">' + no + '</span><span class="name"></span><span class="party"></span></div>' +
        '<div class="ctrl">' +
          '<button class="minus" aria-label="減一票">−</button>' +
          '<input class="count" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off">' +
          '<button class="plus" aria-label="加一票">+</button>' +
        '</div>';
      row.querySelector(".name").textContent = name;
      row.querySelector(".party").textContent = party;
      const input = row.querySelector(".count");
      inputs[no] = input;
      input.value = counts[no] || 0;
      row.querySelector(".minus").onclick = () => set(no, (counts[no] || 0) - 1);
      row.querySelector(".plus").onclick = () => set(no, (counts[no] || 0) + 1);
      input.addEventListener("focus", () => setTimeout(() => input.select(), 0));
      input.addEventListener("input", () => { input.value = input.value.replace(/\D/g, ""); });
      input.addEventListener("blur", () => set(no, input.value));
      input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
      listEl.appendChild(row);
    });
    save();
    pickEl.classList.add("hide");
    counterEl.classList.remove("hide");
    window.scrollTo(0, 0);
  }

  document.getElementById("back").onclick = () => {
    counterEl.classList.add("hide");
    pickEl.classList.remove("hide");
    store.set(LAST, "");
  };

  document.getElementById("reset").onclick = () => {
    if (confirm("確定要把「" + city + "」所有票數歸零嗎？"))
      CANDIDATES[city].forEach((_, i) => set(i + 1, 0));
  };

  const last = store.get(LAST);
  if (last && CANDIDATES[last]) open(last);
})();
</script>
</body>
</html>
